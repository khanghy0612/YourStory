<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Journal</title>
</head>

<body>
    <!-- Back to Journals -->
    <div>
        <a onclick="history.back()">
            Back
        </a>
    </div>

    <div>
        <!-- Title -->
        <div>
            <h1 id="title"></h1>
        </div>

        <!-- Img -->
        <div>
            <img alt="Journal Image" id="img" >
        </div>

        <!-- Day -->
        <div> 
            <p id="day"></p>
        </div>

        <div> 
            <p id="content"></p>
        </div>

        <!-- Add to list / Delete -->
        <button> Add to list </button>
        <button onclick="DeleteJournal()"> Delete </button>
    </div>

    <script src="config.js"> </script>
    <script>
        const token = CheckLogin();

        const params =
            new URLSearchParams(window.location.search);

        const id =
            params.get("id");

        async function LoadJournal()
        {
            const response = await fetch( 
                `${URL}/Journal/${id}`, 
                {
                    method : "GET",
                    headers : 
                    {
                        "Authorization" : `Bearer ${token}`
                    }
                }
            );

            const journal = await response.json();

            document.getElementById("title").innerText = journal.title;
            document.getElementById("content").innerText = journal.content;
            document.getElementById("day").innerText = new Date(journal.posted_day).toLocaleDateString("vi-VN");
            document.getElementById("img").src = journal.img_url;
        }

        LoadJournal();

        async function DeleteJournal()
        {
            const confirmDelete =
                confirm("Delete this journal?");

            if (!confirmDelete)
            {
                return;
            }

            const response = await fetch(
                `${URL}/Journal/${id}`,
                {
                    method: "DELETE",
                    headers:
                    {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

            if (response.ok)
            {
                window.history.back();
            }

        }
    </script>
</body>
</html>
