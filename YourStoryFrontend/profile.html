<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>

<body>
    <div>
        <div>
            <!-- Back to home -->
            <a href="home.html">
                Back
            </a>
        </div>
        
        <div>
            <h1> Profile </h1>
        </div>
        
        <!-- Avt -->
        <img id="avatar" src="avt.png" alt ="Avatar" >
        <br>

        <!-- User name -->
        <p> Username: 
            <span id="username"></span>
        </p>

        <!-- Email -->
        <p> Email: 
            <span id="email"></span>
        </p>

        <!-- Edit Profile -->
        <a href="edit-profile.html">
            <button> Edit Profile </button>
        </a>
        <br>
        <a href="change-password.html">
            <button> Change password </button>
        </a>
        <br>

        <!-- Notice -->
         <div id="notice"></div>
    </div>

    <script src="config.js"></script>

    <script>
        const token = localStorage.getItem("token");

        async function LoadProfile()
        {
            const response = await fetch(`${URL}/User/profile`, { method : "GET",  headers : { Authorization : `Bearer ${token}` } } );

            if( !response.ok ) 
            {
                document.getElementById("notice").innerText = "Please login again!";
                return;
            }

            const data = await response.json();
            console.log(data);

            document.getElementById("username").innerText = data.users_name;
            document.getElementById("email").innerText = data.email;
            document.getElementById("avatar").src = data.avatar_url;
        }

        LoadProfile();
    </script>
</body>

</html>
