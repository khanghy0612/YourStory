    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Journals</title>
    </head>

    <body>
        <!-- Back to home -->
        <div>
            <a href="home.html">
                Back
            </a>
        </div>

        <div>
            <h1> Journals </h1>
        </div>
        
        <!-- PUBLISHED -->
        <div>
            <h2> Published </h2>
            <div id="publishedContainer"> 

            </div>
        
        </div>

        <hr>

        <!-- DRAFT -->
        <div>
            <h2> Draft </h2>
            <div id="draftContainer"> 

            </div>
        </div>

        <script src="config.js"></script>

        <script>
            const token = CheckLogin();
            async function LoadJournals()
            {
                const response = await fetch(
                    `${URL}/Journal` ,
                    {
                        headers :
                        {
                            "Authorization" : `Bearer ${token}`
                        }
                    } );

                const journals = await response.json();

                const publishedContainer =
                    document.getElementById("publishedContainer");

                const draftContainer =
                    document.getElementById("draftContainer");

                for (const journal of journals)
                {
                    const day = new Date(journal.posted_day).toLocaleDateString("vi-VN");

                    if (journal.is_draft)
                    {
                        draftContainer.innerHTML += 
                        `<div> 
                            <h3> ${journal.title} </h3> 
                            <p>${day}</p>
                            <a href="view-journal.html?id=${journal.id}">
                                View
                            </a>
                        </div>`;
                    }
                    else
                    {
                        publishedContainer.innerHTML +=
                        `<div> 
                            <h3> ${journal.title} </h3> 
                            <p>${day}</p>
                            <a href="view-journal.html?id=${journal.id}">
                                View
                            </a>
                        </div>`;
                    }
                }
            }

            LoadJournals();
        </script>
    </body>
    </html>
