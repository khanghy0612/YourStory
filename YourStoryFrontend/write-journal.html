<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Journal</title>
</head>

<body>
    <div>
        <!-- Back to home -->
        <div>
            <a href="home.html">
                Back
            </a>
        </div>

        <div>
            <h1> Write a journal </h1>
        </div>
        
        <form>
            <!-- For you/others -->
            <div>
                <label>Audience</label>
                <br>

                <input type="radio" id="forYou" name="audience" checked>
                <label for="forYou">For You</label>

                <input type="radio" id="forOthers" name="audience">
                <label for="forOthers">For Others</label>
            </div>
            

            <!-- Add img -->
            <div>
                <label for="img"> Add Image</label>
                <br>
                <input type="text" id="img_url" >
            </div>

            <!-- Title -->
            <div>
                <label for="title"> Journal Title </label>
                <br>
                <input type="text" id="title"> 

            </div>

            <!-- Content -->
            <div>
                <label for="content"> Content </label>
                <br>
                <textarea placeholder="Write here" id="content"> </textarea>
            </div>

            <!-- Draft button -->
            <div>
                <button type="button" onclick="CreateJournal(true)"> Save Draft </button>
            </div>

            <!-- Publish button -->
            <div>
                <button type="button" onclick="CreateJournal(false)"> Publish </button>
            </div>
        </form>
    </div>

    <script src="config.js"> </script>
    <script>
        const token = CheckLogin();

        const params =
            new URLSearchParams(window.location.search);

        const id =
            params.get("id");

        if(id) LoadJournal();

        async function CreateJournal( is_draft )
        {
            const journal = 
            {
                title: document.getElementById("title").value,

                content: document.getElementById("content").value,

                img_url: document.getElementById("img_url").value,

                is_draft: is_draft,

                for_you: document.getElementById("forYou").checked
            }

            if( id )
            {
                const response = await fetch(
                    `${URL}/Journal/${id}`,
                    {
                        method : "PUT",
                        headers:
                        {
                            "Content-Type" : "application/json",
                            "Authorization" : `Bearer ${token}`
                        },
                        body : JSON.stringify(journal)
                    }
                );

                if(response.ok)
                    window.location.href = "journals.html";

                return;
            }

            const response = await fetch(
                `${URL}/Journal`,
                {
                    method : "POST",
                    headers:
                    {
                        "Content-Type" : "application/json", 
                        "Authorization" : `Bearer ${token}`
                    },
                    body : JSON.stringify(journal)
                }
            );

            if( response.ok )
            {
                window.location.href = "journals.html";
            }
        }


        async function LoadJournal()
        {
            const response = await fetch( 
                `${URL}/Journal/${id}`, 
                {
                    method : "GET",
                    headers : 
                    {
                        "Authorization" : `Bearer ${token}`
                    }
                }
            );

            const journal = await response.json();

            document.getElementById("title").value = journal.title;
            document.getElementById("content").value = journal.content;
            document.getElementById("img_url").value = journal.img_url;
            if (journal.for_you)
            {
                document.getElementById("forYou").checked = true;
            }
            else
            {
                document.getElementById("forOthers").checked = true;
            }
        }


    </script>
</body>
</html>
