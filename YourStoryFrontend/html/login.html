<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <div>
        <div>
            <!-- To Sign up -->
            <a href="signup.html">
                You don't have accout ? Sign up
            </a>
        </div>

        <div>
            <h1> Login </h1>
        </div>
        
        <form id="loginForm">
            <!-- User name -->
            <input id ="username" type = "text" placeholder="Username">
            <br>

            <!-- Pass word -->
            <input id ="password"  type = "password" placeholder="Password"> 
            <br>
            
            <!-- Login button -->
            <button type="button"
                    onclick= "Login()" >
                Login 
            </button>

            <!-- Notice text -->
            <div id="notice"></div>
        </form>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/login.js"> </script>
</body>
</html>
