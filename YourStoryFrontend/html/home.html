<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>
        <section class="welcome-section">
            <h1> Your Story </h1>
            <p id="hello"></p>
        </section>
        
        <div class="buttons">
            <!-- main buttons -->
            <div class="main-buttons" > 

                <!-- Write -->
                <button class="main-button" id="write-button" type="button" onclick="window.location.href='write-journal.html'">
                    ✎ Viết gì đó !
                </button>

                <div class="side-buttons">
                    <button class="main-button" id="view-button" type="button" onclick="window.location.href='journals.html'">
                        Đọc
                    </button>

                    <button class="main-button" id="list-button" type="button" onclick="window.location.href='lists.html'">
                        Danh sách
                    </button>
                </div> 
            </div>


            <div class="second-buttons" >
                <!-- View Profile -->
                <button id="profile-button" type="button" onclick="window.location.href='profile.html'">
                    Xem thông tin 
                </button>

                <!-- Choose log out -->
                <button id="logout-button" onclick="Logout()"> 
                    Đăng xuất 
                </button>
            </div>
        </div>

    <script src="../js/config.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
