<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password</title>
    <link rel="stylesheet" href="../css/change-password.css" >
</head>
<body>
    <div class="back-section">
        <button class="back-button" type="button" onclick="window.location.href='profile.html'">
            Quay lại
        </button>
    </div>
            

    <div class="pass-container">
        <div id="pass-title">
            <h1> Đổi mật khẩu </h1>
        </div>
        

        <form class="pass-form">
            <input id="oldpass" type="password" placeholder="Mật khẩu hiện tại">
            <input id="newpass" type="password" placeholder="Mật khẩu mới">

            <button id="change-button" onclick="ChangePassword()"> Xác nhận </button>
            <div id="notice"></div>
        </form>

        
    </div>
    
    <script src="../js/config.js"></script>
    <script src="../js/change-password.js"></script>
</body>
</html>
