<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <div>
        <div>
            <!-- Back -->
            <button type="button" onclick="window.location.href='firstpage.html'" >
                Quay lại
            </button>
        </div>
        
        <div>
            <h1> 
                Đăng ký tài khoản
            </h1>
        </div>

        <form>
            <!-- Email -->
            <input  id="email"
                    type="email" placeholder="Email">
            <br>

            <!-- User name -->
            <input  id="username" type="text" placeholder="Tên tài khoản">
            <br>

            <!-- Pass -->
            <input  id="password" type = "password" placeholder="Mật khẩu"> 
            <br>
            
            <!-- Sign up button -->
            <button type="button" onclick="Signup()">
                    Đăng ký 
            </button>

            <!-- Notice text -->
            <div id="notice"></div>
        </form>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/signup.js"></script>
</body>
</html>
