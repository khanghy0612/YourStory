<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Journal</title>
</head>

<body>
    <div>
        <!-- Back to home -->
        <div>
            <!-- Back -->
            <button type="button" onclick="window.location.href='home.html'" >
                Quay lại
            </button>
        </div>

        <div>
            <h1> Viết </h1>
        </div>

        <!-- Notice -->
        <div id="notice"></div>
        
        <form>
            <!-- Label -->
            <div>
                <input type="radio" id="forYou" name="audience" checked>
                <label for="forYou">Cho tui</label>

                <input type="radio" id="forOthers" name="audience">
                <label for="forOthers">Cho người ta</label>
            </div>
            <br>

            <!-- Add img -->
            <div>
                <label for="img_url"> Thêm hình </label>
                <br>
                <input type="text" id="img_url" placeholder="URL của hình" >
            </div>

            <!-- Title -->
            <div>
                <label for="title"> Tiêu đề </label>
                <br>
                <input type="text" id="title" placeholder="..."> 

            </div>

            <!-- Content -->
            <div>
                <label for="content"> Nội dung </label>
                <br>
                <textarea id="content" placeholder="..."></textarea>
            </div>

            <!-- Draft button -->
            <div>
                <button type="button" onclick="CreateJournal(true)"> Lưu bản nháp </button>
            </div>

            <!-- Publish button -->
            <div>
                <button type="button" onclick="CreateJournal(false)"> Đăng </button>
            </div>
        </form>
    </div>

    <script src="../js/config.js"> </script>
    <script src="../js/write-journal.js"></script>
</body>
</html>
